<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAIN TWT</title>
  <style>
    @font-face {
      font-family: 'Paperlogy';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-body: #F4F4F2;
      --text-main: #1F1F1F;
      --text-sub: #2B2B2B;
      --text-muted: #888884;
      --card-bg: rgba(255, 255, 255, 0.94);
      --box-bg: #F7F7F5;
      --box-focus-bg: #EFEFEC;
      --header-bg: #E7E6E2;
      --header-hover-bg: #DCDAD5;
      --slot-bg: #F4F4F2;
      --btn-sub-bg: #FFFFFF;
      --btn-sub-text: #555555;
      --modal-bg: #FFFFFF;
      --btn-close-bg: #F2F2F0;
      --btn-close-text: #333333;
      --fade-start: rgba(255, 255, 255, 0.96);
      --fade-mid: rgba(255, 255, 255, 0.75);
      --fade-end: rgba(255, 255, 255, 0);
      --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.06);
    }

    body.dark-mode {
      --bg-body: #121212;
      --text-main: #F2F2F0;
      --text-sub: #D6D6D2;
      --text-muted: #8A8A86;
      --card-bg: rgba(30, 30, 30, 0.92);
      --box-bg: #262626;
      --box-focus-bg: #2F2F2F;
      --header-bg: #2A2A2A;
      --header-hover-bg: #353535;
      --slot-bg: #262626;
      --btn-sub-bg: #262626;
      --btn-sub-text: #E0E0DC;
      --modal-bg: #1E1E1E;
      --btn-close-bg: #2E2E2E;
      --btn-close-text: #EAEAE6;
      --fade-start: rgba(30, 30, 30, 0.96);
      --fade-mid: rgba(30, 30, 30, 0.75);
      --fade-end: rgba(30, 30, 30, 0);
      --shadow-card: 0 12px 34px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Paperlogy', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      font-weight: 500;
      border: none;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 36px 20px 90px 20px;
      position: relative;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* 전체 배경 블러 레이어 */
    .bg-wallpaper-layer {
      position: fixed;
      inset: -24px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(12px) brightness(0.95);
      z-index: -1;
      opacity: 0;
      transition: opacity 0.35s ease, filter 0.35s ease;
      pointer-events: none;
    }

    body.dark-mode .bg-wallpaper-layer {
      filter: blur(14px) brightness(0.55);
    }

    .bg-wallpaper-layer.active {
      opacity: 1;
    }

    .wrapper {
      width: 100%;
      max-width: 1200px;
      display: flex;
      gap: 28px;
      align-items: stretch;
      position: relative;
      z-index: 1;
    }

    .card {
      background-color: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    /* 왼쪽 프로필 카드 */
    .left-card {
      flex: 0.92;
      min-height: 760px;
    }

    .profile-header {
      width: 100%;
      height: 185px;
      background-color: var(--header-bg);
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.2s ease;
    }

    body.edit-mode .profile-header {
      cursor: pointer;
    }

    body.edit-mode .profile-header:hover {
      background-color: var(--header-hover-bg);
    }

    .profile-header img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .header-placeholder {
      color: var(--text-muted);
      font-size: 13px;
      background: rgba(128, 128, 128, 0.16);
      padding: 7px 15px;
      border-radius: 999px;
      pointer-events: none;
      display: none;
    }

    body.edit-mode .header-placeholder.visible {
      display: inline-block;
    }

    .profile-body {
      flex: 1;
      padding: 0 32px 32px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar-circle {
      width: 136px;
      height: 136px;
      border-radius: 50%;
      background-color: var(--box-bg);
      margin-top: -68px;
      position: relative;
      z-index: 2;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s ease, background-color 0.3s ease;
    }

    body.edit-mode .avatar-circle {
      cursor: pointer;
    }

    body.edit-mode .avatar-circle:hover {
      transform: scale(1.03);
    }

    .avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .avatar-placeholder {
      color: var(--text-muted);
      font-size: 13px;
    }

    .nickname-input {
      width: 100%;
      margin-top: 22px;
      margin-bottom: 20px;
      padding: 13px 16px;
      border-radius: 16px;
      background-color: var(--box-bg);
      font-size: 20px;
      color: var(--text-main);
      text-align: center;
      outline: none;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .nickname-input:read-only {
      cursor: default;
    }

    body.edit-mode .nickname-input:focus {
      background-color: var(--box-focus-bg);
    }

    .bio-box {
      flex: 1;
      width: 100%;
      background-color: var(--box-bg);
      border-radius: 22px;
      padding: 24px;
      display: flex;
      transition: background-color 0.25s ease;
    }

    .bio-textarea {
      width: 100%;
      height: 100%;
      min-height: 260px;
      background: transparent;
      resize: none;
      outline: none;
      font-size: 15px;
      line-height: 1.75;
      color: var(--text-sub);
      text-align: center;
    }

    .bio-textarea:read-only {
      cursor: default;
    }

    /* 오른쪽 카드 */
    .right-card {
      flex: 1.28;
      padding: 32px;
      gap: 26px;
      min-height: 760px;
    }

    .top-section {
      display: flex;
      gap: 16px;
      height: 270px;
      align-items: stretch;
      flex-shrink: 0;
    }

    .vertical-text-wrap {
      width: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .vertical-textarea {
      width: 100%;
      height: 100%;
      writing-mode: vertical-rl;
      text-orientation: upright;
      text-align: center;
      background: transparent;
      resize: none;
      outline: none;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-main);
      letter-spacing: 2px;
      padding: 8px 0;
    }

    .vertical-textarea:read-only {
      cursor: default;
    }

    .photo-slot {
      position: relative;
      border-radius: 22px;
      background-color: var(--slot-bg);
      overflow: hidden;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .photo-slot:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.14);
    }

    .top-photo-slot {
      flex: 1;
    }

    .photo-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .photo-slot:hover img {
      transform: scale(1.03);
    }

    .photo-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.82) 0%, rgba(0, 0, 0, 0.35) 45%, rgba(0, 0, 0, 0) 100%);
      opacity: 0;
      transition: opacity 0.28s ease;
      display: flex;
      align-items: flex-end;
      padding: 20px;
      pointer-events: none;
    }

    .photo-slot:hover .photo-overlay {
      opacity: 1;
    }

    .photo-overlay-text {
      color: #FFFFFF;
      font-size: 15px;
      line-height: 1.4;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: 220px;
      gap: 18px;
    }

    .row-controls {
      display: none;
      gap: 12px;
      margin-top: 2px;
    }

    body.edit-mode .row-controls {
      display: flex;
    }

    .btn-row-action {
      flex: 1;
      padding: 13px 16px;
      border-radius: 16px;
      background-color: var(--box-bg);
      color: var(--text-main);
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.2s ease;
    }

    .btn-row-action:hover {
      background-color: var(--box-focus-bg);
    }

    .btn-row-remove {
      flex: 0.55;
      background-color: rgba(210, 75, 75, 0.14);
      color: #D45D5D;
    }

    /* 우측 하단 플로팅 바 (다크모드 + 관리자 버튼) */
    .floating-admin-bar {
      position: fixed;
      right: 24px;
      bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 90;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn-theme-toggle {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 12px 16px;
      border-radius: 999px;
      background-color: var(--btn-sub-bg);
      color: var(--text-main);
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.25s ease, color 0.25s ease;
    }

    .btn-theme-toggle:hover {
      transform: translateY(-2px);
    }

    .btn-admin-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 18px;
      border-radius: 999px;
      background-color: var(--btn-sub-bg);
      color: var(--text-main);
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.25s ease;
    }

    .btn-admin-toggle:hover {
      transform: translateY(-2px);
    }

    body.edit-mode .btn-admin-toggle {
      background-color: #1F1F1F;
      color: #FFFFFF;
    }

    body.dark-mode.edit-mode .btn-admin-toggle {
      background-color: #F2F2F0;
      color: #141414;
    }

    .btn-edit-sub {
      display: none;
      padding: 12px 16px;
      border-radius: 999px;
      background-color: var(--btn-sub-bg);
      color: var(--btn-sub-text);
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
      cursor: pointer;
    }

    body.edit-mode .btn-edit-sub {
      display: inline-flex;
      align-items: center;
    }

    /* 모달 공통 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
      overflow-y: auto;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .detail-modal-card {
      background: var(--modal-bg);
      color: var(--text-main);
      width: 100%;
      max-width: 920px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .modal-card.small-modal {
      background: var(--modal-bg);
      color: var(--text-main);
      width: 100%;
      max-width: 380px;
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 18px;
      color: var(--text-main);
    }

    .btn-close {
      background: var(--btn-close-bg);
      color: var(--btn-close-text);
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
    }

    /* 관리자 전용 요소 */
    .admin-only-control {
      display: none !important;
    }

    body.edit-mode .admin-only-control {
      display: inline-flex !important;
    }

    body.edit-mode .admin-only-flex {
      display: flex !important;
    }

    /* 상세 모달 내부 */
    .detail-banner {
      position: relative;
      width: 100%;
      height: 220px;
      border-radius: 20px;
      background-color: var(--slot-bg);
      overflow: hidden;
      display: flex;
      align-items: center;
    }

    .detail-banner img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .detail-banner-fade {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, var(--fade-start) 0%, var(--fade-mid) 38%, var(--fade-end) 75%);
      pointer-events: none;
    }

    .detail-banner-text {
      position: relative;
      z-index: 2;
      padding: 24px 28px;
      width: 60%;
    }

    .detail-title-input {
      width: 100%;
      background: transparent;
      font-size: 22px;
      color: var(--text-main);
      outline: none;
    }

    .detail-title-input:read-only {
      cursor: default;
    }

    body.edit-mode .detail-title-input {
      border-bottom: 1px dashed var(--text-muted);
      padding-bottom: 4px;
    }

    .detail-split {
      display: flex;
      gap: 20px;
      align-items: stretch;
    }

    .detail-left-box {
      flex: 1;
      background: var(--box-bg);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .detail-sub-title {
      width: 100%;
      background: transparent;
      font-size: 17px;
      color: var(--text-main);
      outline: none;
    }

    .detail-sub-title:read-only {
      cursor: default;
    }

    body.edit-mode .detail-sub-title {
      border-bottom: 1px dashed var(--text-muted);
      padding-bottom: 6px;
    }

    .detail-desc-area {
      width: 100%;
      flex: 1;
      min-height: 160px;
      background: transparent;
      resize: none;
      outline: none;
      font-size: 14px;
      line-height: 1.65;
      color: var(--text-sub);
    }

    .detail-desc-area:read-only {
      cursor: default;
    }

    .detail-right-box {
      flex: 1.25;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .detail-sub-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: 110px;
      gap: 10px;
    }

    .detail-sub-photo {
      border-radius: 14px;
      overflow: hidden;
      background: var(--box-bg);
      position: relative;
      cursor: default;
    }

    .detail-sub-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    body.edit-mode .detail-sub-photo {
      cursor: pointer;
    }

    body.edit-mode .detail-sub-photo::after {
      content: '변경';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    body.edit-mode .detail-sub-photo:hover::after {
      opacity: 1;
    }

    .modal-input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .modal-label {
      font-size: 13px;
      color: var(--text-muted);
    }

    .modal-input {
      width: 100%;
      padding: 13px 16px;
      border-radius: 14px;
      background-color: var(--box-bg);
      font-size: 15px;
      outline: none;
      color: var(--text-main);
    }

    .btn-primary {
      flex: 1;
      background-color: #1F1F1F;
      color: #FFFFFF;
      padding: 13px;
      border-radius: 14px;
      font-size: 15px;
      cursor: pointer;
      text-align: center;
    }

    body.dark-mode .btn-primary {
      background-color: #F2F2F0;
      color: #141414;
    }

    .btn-secondary {
      flex: 1;
      background-color: var(--box-bg);
      color: var(--text-main);
      padding: 13px;
      border-radius: 14px;
      font-size: 15px;
      cursor: pointer;
      text-align: center;
    }

    .error-msg {
      color: #E05A5A;
      font-size: 13px;
      display: none;
    }

    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(20, 20, 20, 0.94);
      color: #FFFFFF;
      padding: 11px 22px;
      border-radius: 999px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    input[type="file"] {
      display: none;
    }

    .wrapper {
      transition: opacity 0.3s ease;
    }

    body.loading .wrapper {
      opacity: 0;
    }

    @media (max-width: 900px) {
      .wrapper, .detail-split {
        flex-direction: column;
      }
      .left-card, .right-card {
        min-height: auto;
      }
    }
  </style>
</head>
<body class="loading">

  <div class="bg-wallpaper-layer" id="bg-wallpaper-layer"></div>
  <input type="file" id="bg-file" accept="image/*" onchange="updateCustomImage(event, 'bg')" />

  <div class="toast" id="toast"></div>

  <div class="wrapper">
    <!-- 왼쪽 프로필 카드 -->
    <section class="card left-card">
      <div class="profile-header" onclick="handleHeaderClick()">
        <img id="header-img" src="" alt="헤더 이미지" />
        <span class="header-placeholder visible" id="header-placeholder">클릭하여 헤더 사진 선택</span>
        <input type="file" id="header-file" accept="image/*" onchange="updateCustomImage(event, 'header')" />
      </div>

      <div class="profile-body">
        <div class="avatar-circle" onclick="handleAvatarClick()">
          <img id="avatar-img" src="" alt="프로필 사진" />
          <span class="avatar-placeholder" id="avatar-placeholder">프로필</span>
          <input type="file" id="avatar-file" accept="image/*" onchange="updateCustomImage(event, 'avatar')" />
        </div>

        <input type="text" id="nickname-input" class="nickname-input" placeholder="닉네임" readonly oninput="saveAllData()" />

        <div class="bio-box">
          <textarea id="bio-textarea" class="bio-textarea" placeholder="소개 글을 작성해 주세요." readonly oninput="saveAllData()"></textarea>
        </div>
      </div>
    </section>

    <!-- 오른쪽 카드 -->
    <section class="card right-card">
      <div class="top-section">
        <div class="vertical-text-wrap">
          <textarea id="vertical-textarea" class="vertical-textarea" placeholder="텍스트" readonly oninput="saveAllData()"></textarea>
        </div>

        <div class="photo-slot top-photo-slot" onclick="openPhotoModal('top')">
          <img id="top-photo-img" src="" alt="메인 사진" />
          <div class="photo-overlay">
            <span class="photo-overlay-text" id="top-photo-caption"></span>
          </div>
        </div>
      </div>

      <div class="gallery-grid" id="gallery-grid"></div>

      <div class="row-controls">
        <button type="button" class="btn-row-action" onclick="addGalleryRow()">+ 사진 줄 추가 (3칸)</button>
        <button type="button" class="btn-row-action btn-row-remove" id="btn-remove-row" onclick="removeLastGalleryRow()">마지막 줄 삭제</button>
      </div>
    </section>
  </div>

  <!-- 우측 하단 플로팅 바 -->
  <div class="floating-admin-bar">
    <button type="button" class="btn-edit-sub" onclick="document.getElementById('bg-file').click()">배경 사진 선택</button>
    <button type="button" class="btn-edit-sub" id="btn-reset-bg" onclick="resetBackgroundImage()">배경 초기화</button>
    <button type="button" class="btn-edit-sub" onclick="openPasswordChangeModal()">비밀번호 변경</button>
    <button type="button" class="btn-theme-toggle" id="btn-theme-toggle" onclick="toggleDarkMode()">
      <span id="theme-btn-text">다크모드</span>
    </button>
    <button type="button" class="btn-admin-toggle" id="btn-admin-toggle" onclick="toggleAdminMode()">
      <span id="admin-btn-text">관리자 편집</span>
    </button>
  </div>

  <!-- 사진 클릭 시 열리는 스케치 레이아웃 상세 모달 -->
  <div class="modal-backdrop" id="photo-modal" onclick="closeBackdrop(event, 'photo-modal')">
    <div class="detail-modal-card">
      <div class="modal-header">

    const imageCache = new Map();   // id -> dataURL
    const uploadedIds = new Set();  // 이미 클라우드에 올라간 이미지 id
    let cloudLoaded = false;
    let pendingMigration = false;
    let adminPwHash = '';                                 // 클라우드에 저장된 관리자 비밀번호 해시

    const defaultData = {
      bgImg: '',

      galleryPhotos: [
        createPhotoItem('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=600&q=80', '첫 번째 기록'),

        createPhotoItem('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=600&q=80', '세 번째 기록')
      ]
    };

    let appData = JSON.parse(JSON.stringify(defaultData));

    /* 다크모드 초기화 및 토글 */
    function initTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
      if (savedTheme === 'dark') {

    function loadLegacyLocal() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return JSON.parse(saved);
      } catch (e) {
        console.error(e);
      }
      return null;
    }

    /* ----- 이미지 압축 / 해시 ----- */
    function hashStr(str) {
      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      for (let i = 0; i < str.length; i++) {
        const ch = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0') + '-' + str.length.toString(36);
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    async function compressImageSource(src, maxDim = 1400) {
      const img = await loadImage(src);
      const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
      let w = Math.max(1, Math.round(img.naturalWidth * scale));
      let h = Math.max(1, Math.round(img.naturalHeight * scale));
      const canvas = document.createElement('canvas');
      let quality = 0.85;
      let out = '';
      for (let attempt = 0; attempt < 10; attempt++) {
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        out = canvas.toDataURL('image/jpeg', quality);
        if (out.length <= MAX_IMG_CHARS) return out;
        if (quality > 0.55) {
          quality -= 0.1;
        } else {
          w = Math.round(w * 0.8);
          h = Math.round(h * 0.8);
        }
      }
      return out;
    }

    async function compressFile(file, maxDim) {
      const url = URL.createObjectURL(file);
      try {
        return await compressImageSource(url, maxDim);
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    /* ----- 클라우드(Firestore) 저장 / 불러오기 ----- */
    async function stripImages(value, pending) {
      if (typeof value === 'string') {
        if (!value.startsWith('data:image')) return value;
        let data = value;
        if (data.length > MAX_IMG_CHARS) data = await compressImageSource(data, 1400);
        const id = hashStr(data);
        pending.set(id, data);
        return IMG_PREFIX + id;
      }
      if (Array.isArray(value)) {
        const arr = [];
        for (const v of value) arr.push(await stripImages(v, pending));
        return arr;
      }
      if (value && typeof value === 'object') {
        const out = {};
        for (const k of Object.keys(value)) out[k] = await stripImages(value[k], pending);
        return out;
      }
      return value;
    }

    function collectRefs(value, set) {
      if (typeof value === 'string') {
        if (value.startsWith(IMG_PREFIX)) set.add(value.slice(IMG_PREFIX.length));
      } else if (Array.isArray(value)) {
        value.forEach(v => collectRefs(v, set));
      } else if (value && typeof value === 'object') {
        Object.values(value).forEach(v => collectRefs(v, set));
      }
    }

    function resolveRefs(value) {
      if (typeof value === 'string') {
        return value.startsWith(IMG_PREFIX) ? (imageCache.get(value.slice(IMG_PREFIX.length)) || '') : value;
      }
      if (Array.isArray(value)) return value.map(resolveRefs);
      if (value && typeof value === 'object') {
        const out = {};
        for (const k of Object.keys(value)) out[k] = resolveRefs(value[k]);
        return out;
      }
      return value;
    }

    async function loadFromCloud() {
      const [cfgSnap, snap] = await Promise.all([
        getDoc(doc(db, 'site', 'config')),
        getDoc(doc(db, 'site', 'profile'))
      ]);
      if (cfgSnap.exists()) adminPwHash = cfgSnap.data().pwHash || '';
      if (!snap.exists()) return null;
      const stripped = JSON.parse(snap.data().json);
      const refs = new Set();
      collectRefs(stripped, refs);
      await Promise.all([...refs].map(async id => {
        if (imageCache.has(id)) return;
        const s = await getDoc(doc(db, 'images', id));
        if (s.exists()) {
          imageCache.set(id, s.data().data);
          uploadedIds.add(id);
        }
      }));
      return resolveRefs(stripped);
    }

    async function pushToCloud() {
      const pending = new Map();
      const stripped = await stripImages(appData, pending);
      for (const [id, data] of pending) {
        if (uploadedIds.has(id)) continue;
        await setDoc(doc(db, 'images', id), { data });
        uploadedIds.add(id);
      }
      await setDoc(doc(db, 'site', 'profile'), { json: JSON.stringify(stripped), updatedAt: Date.now() });
    }

    async function hashPw(pw) {
      if (window.crypto && crypto.subtle) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('main-twt:' + pw));
        return 'sha256:' + [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
      }
      return 'h:' + hashStr('main-twt:' + pw);
    }

    function handleSaveError(e) {
      console.error(e);
      if (e && e.code === 'permission-denied') {
        showToast('저장 권한이 없어요. Firebase 규칙을 확인해 주세요.');
      } else {
        showToast('저장에 실패했어요. 인터넷 연결을 확인해 주세요.');
      }
    }

    function flushSave() {
      clearTimeout(saveTimer);
      if (!dirty) return savePromise;
      dirty = false;
      savePromise = savePromise.then(async () => {
        try {
          await pushToCloud();
          lastSaveOk = true;
        } catch (e) {
          lastSaveOk = false;
          dirty = true;
          handleSaveError(e);
        }
      });
      return savePromise;
    }

    function saveAllData(immediate = false) {
      if (!isEditMode) return Promise.resolve();
      appData.nickname = document.getElementById('nickname-input').value;
      appData.bio = document.getElementById('bio-textarea').value;
      appData.verticalText = document.getElementById('vertical-textarea').value;
      dirty = true;
      if (immediate) return flushSave();
      clearTimeout(saveTimer);
      saveTimer = setTimeout(flushSave, 900);
      return Promise.resolve();
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && dirty) flushSave();
    });

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2400);
    }

    function renderAll() {
      const bgLayer = document.getElementById('bg-wallpaper-layer');
      const resetBgBtn = document.getElementById('btn-reset-bg');
      if (appData.bgImg) {
        bgLayer.style.backgroundImage = `url('${appData.bgImg}')`;
        bgLayer.classList.add('active');
        resetBgBtn.style.display = isEditMode ? 'inline-flex' : 'none';
      } else {
        bgLayer.style.backgroundImage = 'none';
        bgLayer.classList.remove('active');
        resetBgBtn.style.display = 'none';
      }

      const headerImg = document.getElementById('header-img');
      const headerPlaceholder = document.getElementById('header-placeholder');
      if (appData.headerImg) {
        headerImg.src = appData.headerImg;
        headerImg.style.display = 'block';
        headerPlaceholder.classList.remove('visible');
      } else {
        headerImg.style.display = 'none';
        headerPlaceholder.classList.add('visible');
      }

      const avatarImg = document.getElementById('avatar-img');
      const avatarPlaceholder = document.getElementById('avatar-placeholder');
      if (appData.avatarImg) {
        avatarImg.src = appData.avatarImg;
        avatarImg.style.display = 'block';
        avatarPlaceholder.style.display = 'none';
      } else {
        avatarImg.style.display = 'none';
        avatarPlaceholder.style.display = 'block';
      }

      document.getElementById('nickname-input').value = appData.nickname || '';
      document.getElementById('bio-textarea').value = appData.bio || '';
      document.getElementById('vertical-textarea').value = appData.verticalText || '';

      document.getElementById('top-photo-img').src = appData.topPhoto.src;
      document.getElementById('top-photo-caption').textContent = appData.topPhoto.caption;

      renderGalleryGrid();
    }

    function renderGalleryGrid() {
      const grid = document.getElementById('gallery-grid');
      grid.innerHTML = '';

      appData.galleryPhotos.forEach((item, index) => {
        const slot = document.createElement('div');
        slot.className = 'photo-slot';

        const img = document.createElement('img');
        img.src = item.src;
        img.alt = item.caption || `사진 ${index + 1}`;

        const overlay = document.createElement('div');
        overlay.className = 'photo-overlay';

        const captionSpan = document.createElement('span');
        captionSpan.className = 'photo-overlay-text';
        captionSpan.textContent = item.caption || '';

        overlay.appendChild(captionSpan);
        slot.appendChild(img);
        slot.appendChild(overlay);
        grid.appendChild(slot);
      });

      const removeBtn = document.getElementById('btn-remove-row');
      removeBtn.style.display = appData.galleryPhotos.length > 3 ? 'block' : 'none';
    }

    function addGalleryRow() {
      if (!isEditMode) return;
      const placeholders = [
        'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=600&q=80',
        'https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=600&q=80',
        'https://images.unsplash.com/photo-1426604966848-d7adac402bff?auto=format&fit=crop&w=600&q=80'

      const baseCount = appData.galleryPhotos.length;
      for (let i = 0; i < 3; i++) {
        appData.galleryPhotos.push(createPhotoItem(placeholders[i % placeholders.length], `${baseCount + i + 1}번째 기록`));
      }
      saveAllData(true);
      renderGalleryGrid();
      showToast('사진 1줄(3칸)이 추가되었습니다.');
    }

    function removeLastGalleryRow() {
      if (!isEditMode || appData.galleryPhotos.length <= 3) return;
      appData.galleryPhotos.splice(-3, 3);
      saveAllData(true);
      renderGalleryGrid();
      showToast('마지막 사진 줄이 삭제되었습니다.');
    }

    async function toggleAdminMode() {
      if (isEditMode) {
        await saveAllData(true);
        if (!lastSaveOk) {
          showToast('저장에 실패해서 잠금을 보류했어요. 인터넷 연결을 확인해 주세요.');
          return;
        }
        setEditMode(false);
        showToast('저장 및 잠금 완료');
      } else {
        if (!cloudLoaded) {
          showToast('저장된 데이터를 아직 불러오지 못했어요. 새로고침 후 다시 시도해 주세요.');
          return;
        }
        document.getElementById('admin-pw-input').value = '';
        document.getElementById('auth-error-msg').style.display = 'none';
        document.getElementById('auth-modal').classList.add('active');
        setTimeout(() => document.getElementById('admin-pw-input').focus(), 80);
      }
    }

    async function verifyPassword() {
      const inputPw = document.getElementById('admin-pw-input').value;
      const errEl = document.getElementById('auth-error-msg');
      if (!inputPw) return;

      const inputHash = await hashPw(inputPw);
      let expected = adminPwHash;
      if (!expected) {
        // 아직 클라우드에 비밀번호가 없으면: 이 기기에서 예전에 바꿔 둔 비밀번호 → 없으면 초기값
        expected = await hashPw(localStorage.getItem(LEGACY_PW_KEY) || DEFAULT_PW);
      }

      if (inputHash !== expected) {
        errEl.textContent = '비밀번호가 일치하지 않습니다.';
        errEl.style.display = 'block';
        return;
      }

      if (!adminPwHash) {
        adminPwHash = inputHash;
        setDoc(doc(db, 'site', 'config'), { pwHash: inputHash }).catch(handleSaveError);
      }

      closeModal('auth-modal');
      setEditMode(true);
      showToast('관리자 편집 모드 활성화');

      if (pendingMigration) {
        pendingMigration = false;
        dirty = true;
        flushSave().then(() => {
          if (lastSaveOk) showToast('이 기기에 있던 편집 내용을 클라우드로 옮겼어요.');
        });
      }
    }

    function setEditMode(enabled) {
      isEditMode = enabled;
      document.body.classList.toggle('edit-mode', enabled);

      ['nickname-input', 'bio-textarea', 'vertical-textarea'].forEach(id => {
        document.getElementById(id).readOnly = !enabled;
      });

      const resetBgBtn = document.getElementById('btn-reset-bg');
      resetBgBtn.style.display = (enabled && appData.bgImg) ? 'inline-flex' : 'none';

      document.getElementById('admin-btn-text').textContent = enabled ? '편집 완료 (잠금)' : '관리자 편집';
    }

    function openPasswordChangeModal() {
      if (!isEditMode) return;
      document.getElementById('new-pw-input').value = '';
      document.getElementById('pw-change-modal').classList.add('active');
    }

    async function saveNewPassword() {
      if (!isEditMode) return;
      const newPw = document.getElementById('new-pw-input').value.trim();
      if (!newPw) return showToast('새 비밀번호를 입력해 주세요.');
      if (newPw.length < 4) return showToast('비밀번호는 4자 이상이어야 해요.');
      try {
        const h = await hashPw(newPw);
        await setDoc(doc(db, 'site', 'config'), { pwHash: h });
        adminPwHash = h;
        closeModal('pw-change-modal');
        showToast('비밀번호가 변경되었습니다.');
      } catch (e) {
        handleSaveError(e);
      }
    }

    function handleHeaderClick() {
      if (isEditMode) document.getElementById('header-file').click();
    }

    function handleAvatarClick() {
      if (isEditMode) document.getElementById('avatar-file').click();
    }

    async function updateCustomImage(event, type) {
      if (!isEditMode) return;
      const file = event.target.files[0];
      event.target.value = '';
      if (!file) return;
      try {
        const maxDim = type === 'avatar' ? 600 : type === 'bg' ? 1600 : 1400;
        const dataUrl = await compressFile(file, maxDim);
        if (type === 'header') appData.headerImg = dataUrl;
        else if (type === 'avatar') appData.avatarImg = dataUrl;
        else if (type === 'bg') appData.bgImg = dataUrl;
        renderAll();
        await saveAllData(true);
        if (lastSaveOk) showToast('이미지가 적용되었습니다.');
      } catch (e) {
        console.error(e);
        showToast('이미지를 불러오지 못했어요.');
      }
    }

    function resetBackgroundImage() {
      if (!isEditMode) return;
      appData.bgImg = '';
      saveAllData(true);
      renderAll();
      showToast('배경이 초기화되었습니다.');
    }

    function openPhotoModal(target) {
      currentEditingTarget = target;
      const photoObj = target === 'top' ? appData.topPhoto : appData.galleryPhotos[target];

      tempBannerDataUrl = photoObj.src;
      tempSubPhotos = [...(photoObj.subPhotos || [])];

      document.getElementById('photo-modal-title').textContent = isEditMode ? '상세 기록 편집 (관리자)' : '상세 기록';
      document.getElementById('detail-banner-img').src = photoObj.src;
      document.getElementById('detail-caption-input').value = photoObj.caption || '';
      document.getElementById('detail-sub-title').value = photoObj.subTitle || '';
      document.getElementById('detail-desc-area').value = photoObj.desc || '';

      ['detail-caption-input', 'detail-sub-title', 'detail-desc-area'].forEach(id => {
        document.getElementById(id).readOnly = !isEditMode;
      });

      renderDetailSubGrid();
      document.getElementById('photo-modal').classList.add('active');
    }

    function triggerBannerFile() {
      if (!isEditMode) return;
      document.getElementById('modal-banner-file').click();
    }

    function renderDetailSubGrid() {
      const grid = document.getElementById('detail-sub-grid');
      grid.innerHTML = '';

      tempSubPhotos.forEach((src, idx) => {
        const box = document.createElement('div');
        box.className = 'detail-sub-photo';

        if (isEditMode) {
          box.title = '클릭하여 사진 변경';
          box.onclick = () => {
            currentSubPhotoIndex = idx;
            document.getElementById('detail-sub-file').click();
          };
        }

        const img = document.createElement('img');
        img.src = src;
        box.appendChild(img);
        grid.appendChild(box);
      });

      const removeSubBtn = document.getElementById('btn-remove-sub-row');
      if (removeSubBtn) {
        removeSubBtn.style.display = (isEditMode && tempSubPhotos.length > 3) ? 'block' : 'none';
      }
    }

    async function handleDetailBannerFile(event) {
      if (!isEditMode) return;
      const file = event.target.files[0];
      event.target.value = '';
      if (!file) return;
      try {
        tempBannerDataUrl = await compressFile(file, 1400);
        document.getElementById('detail-banner-img').src = tempBannerDataUrl;
      } catch (e) {
        console.error(e);
        showToast('이미지를 불러오지 못했어요.');
      }
    }

    async function handleDetailSubFile(event) {
      if (!isEditMode) return;
      const file = event.target.files[0];
      event.target.value = '';
      if (!file || currentSubPhotoIndex === null) return;
      try {
        tempSubPhotos[currentSubPhotoIndex] = await compressFile(file, 700);
        renderDetailSubGrid();
      } catch (e) {
        console.error(e);
        showToast('이미지를 불러오지 못했어요.');
      }
    }

    function addDetailSubRow() {
      if (!isEditMode) return;
      tempSubPhotos.push(
        'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=400&q=80',
        'https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=400&q=80',
        'https://images.unsplash.com/photo-1426604966848-d7adac402bff?auto=format&fit=crop&w=400&q=80'
      );
      renderDetailSubGrid();
    }

    function removeDetailSubRow() {
      if (!isEditMode || tempSubPhotos.length <= 3) return;
      tempSubPhotos.splice(-3, 3);
      renderDetailSubGrid();
    }

    async function saveDetailChanges() {
      if (!isEditMode || currentEditingTarget === null) return;
      const photoObj = currentEditingTarget === 'top' ? appData.topPhoto : appData.galleryPhotos[currentEditingTarget];

      photoObj.src = tempBannerDataUrl;
      photoObj.caption = document.getElementById('detail-caption-input').value;
      photoObj.subTitle = document.getElementById('detail-sub-title').value;
      photoObj.desc = document.getElementById('detail-desc-area').value;
      photoObj.subPhotos = [...tempSubPhotos];

      renderAll();
      closeModal('photo-modal');
      await saveAllData(true);
      if (lastSaveOk) showToast('상세 기록이 저장되었습니다.');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    function closeBackdrop(event, modalId) {
      if (event.target.id === modalId) {
        closeModal(modalId);
      }
    }

    /* type="module" 스크립트는 인라인 onclick에서 함수가 보이지 않으므로 window에 노출 */
    Object.assign(window, {
      updateCustomImage, saveAllData, openPhotoModal, handleHeaderClick, handleAvatarClick,
      addGalleryRow, removeLastGalleryRow, resetBackgroundImage, openPasswordChangeModal,
      toggleDarkMode, toggleAdminMode, triggerBannerFile, saveDetailChanges,
      closeModal, closeBackdrop, handleDetailBannerFile, handleDetailSubFile,
      addDetailSubRow, removeDetailSubRow, verifyPassword, saveNewPassword
    });

    async function initApp() {
      initTheme();
      setEditMode(false);
      try {
        const cloud = await Promise.race([
          loadFromCloud(),
          new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 15000))
        ]);
        cloudLoaded = true;
        if (cloud) {
          appData = { ...defaultData, ...cloud };
        } else {
          const legacy = loadLegacyLocal();
          if (legacy) {
            appData = { ...defaultData, ...legacy };
            pendingMigration = true;
          }
        }
      } catch (e) {
        console.error(e);
        showToast('저장된 데이터를 불러오지 못했어요.');
      }
      renderAll();
      document.body.classList.remove('loading');
    }

    initApp();

  </script>
  
</body>

</html>
